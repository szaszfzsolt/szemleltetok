<!doctype html><html lang="hu"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sententiae Latinae</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first single column; sticky title strip on top, thumb-reach tab bar fixed at the bottom */
:root{
  --bg:#eceee9; --surface:#fbfcf9; --line:#d3d8cf; --ink:#1c2330; --muted:#5b6470;
  --accent:#2b4a8b; --accent-soft:#e1e7f4; --gold:#a8822a;
  --good:#2d7a4c; --good-soft:#e2f1e7; --bad:#b0383a; --bad-soft:#f7e3e2;
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;
  --f-latin:"Alegreya",Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1a2029; --line:#2d3542; --ink:#e7eaef; --muted:#9aa3b0;
  --accent:#8ca8e8; --accent-soft:#223152; --gold:#d8b55c;
  --good:#6cc493; --good-soft:#173528; --bad:#ec8a88; --bad-soft:#3d1d1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a2029; --line:#2d3542; --ink:#e7eaef; --muted:#9aa3b0;
  --accent:#8ca8e8; --accent-soft:#223152; --gold:#d8b55c;
  --good:#6cc493; --good-soft:#173528; --bad:#ec8a88; --bad-soft:#3d1d1f; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 20px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
@media (min-width:600px){body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
h1{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.12em;margin:0}
.mode-name{font-size:14px;color:var(--muted);text-align:right}

nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav button{font:inherit;border:0;background:none;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;line-height:1.1;padding:4px 2px;position:relative}
nav button b{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;font-weight:700}
nav button span{font-size:12px}
nav button[aria-selected="true"]{color:var(--accent)}
nav button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 16px;display:flex;flex-direction:column;gap:16px}
.status{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.streak{color:var(--gold);font-weight:700}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.task{font-size:13px;color:var(--muted);margin:0;text-transform:uppercase;letter-spacing:.08em}
.prompt{font-family:var(--f-latin);font-size:24px;line-height:1.3;margin:0;text-wrap:balance}
.prompt.latin{font-style:italic}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;
  min-height:56px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt .k{font-family:var(--f-display);font-size:13px;color:var(--muted);min-width:1.1em}
.opt .t{min-width:0}
.opt.lat .t{font-family:var(--f-latin);font-style:italic;font-size:19px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent)}}

.feedback{border-left:3px solid var(--accent);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:4px}
.feedback.ok{border-color:var(--good)} .feedback.no{border-color:var(--bad)}
.verdict{font-weight:700}
.ok .verdict{color:var(--good)} .no .verdict{color:var(--bad)}
.feedback .lat{font-family:var(--f-latin);font-style:italic;font-size:19px}
.feedback .row{color:var(--muted);font-size:15px} .feedback .row b{color:var(--ink);font-weight:700;font-size:12px;letter-spacing:.06em}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:10px;
  min-height:50px;padding:10px 18px;cursor:pointer;flex:1 1 auto}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}

/* puzzle */
.slot{min-height:64px;border:2px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.slot.right{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.slot.wrong{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .empty{color:var(--muted);font-size:15px;align-self:center;padding-left:4px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tile{font-family:var(--f-latin);font-style:italic;font-size:19px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:8px;min-height:46px;padding:6px 12px;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.slot .tile{background:var(--surface);border-color:var(--accent)}
.tile:disabled{cursor:default}

.result{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.big{font-family:var(--f-display);font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.word{font-family:var(--f-latin);font-style:italic;font-size:21px}
.miss{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px;margin-top:4px}
.miss h3{margin:0;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.miss div{border-top:1px solid var(--line);padding-top:8px;font-size:15px}
.miss .lat{font-family:var(--f-latin);font-style:italic;font-size:17px}
.settings{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.settings select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px}

.list{display:flex;flex-direction:column}
.item{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:2em 1fr;gap:2px 8px}
.item:first-child{border-top:0}
.item .n{color:var(--muted);font-variant-numeric:tabular-nums;grid-row:span 3}
.item .lat{font-family:var(--f-latin);font-style:italic;font-size:19px}
.item .hu{font-size:15px}
.item .ro{font-size:15px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header><h1>SENTENTIAE</h1><span class="mode-name" id="mode-name"></span></header>
  <main class="card" id="stage" aria-live="polite"></main>
</div>

<nav aria-label="Játékmódok"><div class="in" role="tablist">
  <button role="tab" id="tab-alak" data-mode="alak"><b>FORMA</b><span>Alak</span></button>
  <button role="tab" id="tab-jelentes" data-mode="jelentes"><b>SENSUS</b><span>Jelentés</span></button>
  <button role="tab" id="tab-roman" data-mode="roman"><b>ROM.</b><span>Román</span></button>
  <button role="tab" id="tab-kirako" data-mode="kirako"><b>ORDO</b><span>Kirakó</span></button>
  <button role="tab" id="tab-lista" data-mode="lista"><b>INDEX</b><span>Lista</span></button>
</div></nav>

<script>
const P=[
 {la:"Veni, vidi, vici.",hu:"Jöttem, láttam, győztem.",ro:"Am venit, am văzut, am învins.",bad:["Veni, vidi, vinci.","Vene, vidi, vici.","Veni, vidit, vici."],g:"A venio, video, vinco igék múlt ideje (perfectum), egyes szám 1. személyben."},
 {la:"Cogito, ergo sum.",hu:"Gondolkodom, tehát vagyok.",ro:"Cuget, deci exist.",bad:["Cogito, ergo est.","Cogitas, ergo sum.","Cogito, ergo sumus."],g:"Mindkét ige egyes szám 1. személy: cogito (gondolkodom), sum (vagyok)."},
 {la:"Alea iacta est.",hu:"A kocka el van vetve.",ro:"Zarurile au fost aruncate.",bad:["Alea iactus est.","Aleam iacta est.","Alea iactum est."],g:"Az alea nőnemű alany, ezért a melléknévi igenév is nőnemű: iacta."},
 {la:"In vino veritas.",hu:"Borban az igazság.",ro:"În vin e adevărul.",bad:["In vinum veritas.","In vino veritatis.","In vini veritas."],g:"Az in helyhatározói jelentésben ablativust kíván: vino; a veritas alanyeset."},
 {la:"Nil terribile nisi ipse timor.",hu:"Nincs mitől félni, csak magától a félelemtől.",ro:"Nimic nu e de temut, decât frica însăși.",bad:["Nil terribilis nisi ipse timor.","Nil terribile nisi ipsa timor.","Nil terribile nisi ipse timorem."],g:"A nil semleges nemű, ezért terribile; a timor hímnemű alanyeset, ezért ipse."},
 {la:"Si vis amari, ama.",hu:"Ha azt akarod, hogy szeressenek, szeress.",ro:"Dacă vrei să fii iubit, iubește.",bad:["Si vis amaris, ama.","Si vi amari, ama.","Si vis amari, amat."],g:"Amari szenvedő főnévi igenév (szeretve lenni), ama felszólító mód (szeress!)."},
 {la:"Fiat iustitia, pereat mundus.",hu:"Legyen igazság, vagy vesszen a világ!",ro:"Să se facă dreptate, chiar de-ar pieri lumea!",bad:["Fiat iustitiam, pereat mundus.","Fiat iustitia, pereat mundum.","Fiant iustitia, pereant mundus."],g:"Fiat és pereat kötőmód (coniunctivus), egyes szám 3. személy; az alanyok alanyesetben."},
 {la:"Medicus curat, natura sanat.",hu:"Az orvos kezel, a természet gyógyít.",ro:"Medicul tratează, natura vindecă.",bad:["Medicus curat, naturam sanat.","Medicum curat, natura sanat.","Medicus curant, natura sanat."],g:"Medicus és natura az alanyok (alanyeset), az igék egyes szám 3. személyűek."},
 {la:"Repetitio est mater studiorum.",hu:"Az ismétlés a tudás anyja.",ro:"Repetiția este mama învățăturii.",bad:["Repetitio est mater studiis.","Repetitio est matrem studiorum.","Repetitio sunt mater studiorum."],g:"Mater alanyeset (névszói állítmány), studiorum többes számú birtokos eset."},
 {la:"Verba volant, scripta manent.",hu:"A szó elszáll, az írás megmarad.",ro:"Vorbele zboară, scrisul rămâne.",bad:["Verba volat, scripta manent.","Verbum volant, scripta manent.","Verba volant, scriptam manent."],g:"Verba és scripta semleges nemű többes szám, ezért az ige többes 3. személy: volant, manent."},
 {la:"Fortes fortuna adiuvat.",hu:"A bátraké a szerencse.",ro:"Norocul îi ajută pe cei curajoși.",bad:["Fortes fortunam adiuvat.","Fortes fortuna adiuvant.","Fortibus fortuna adiuvat."],g:"Fortuna az alany, fortes többes számú tárgyeset (a bátrakat segíti), adiuvat egyes szám 3. személy."},
 {la:"Carpe diem.",hu:"Élj a mának! (Ragadd meg a napot!)",ro:"Trăiește clipa! (Prinde ziua!)",bad:["Carpe dies.","Carpe die.","Carpi diem."],g:"Carpe felszólító mód, diem a dies (nap) tárgyesete."},
 {la:"Errare humanum est.",hu:"Tévedni emberi dolog.",ro:"A greși este omenește.",bad:["Errare humanus est.","Errare humanum sunt.","Errat humanum est."],g:"Az alanyként álló főnévi igenév semleges nemű, ezért humanum; est egyes szám."},
 {la:"Mens sana in corpore sano.",hu:"Ép testben ép lélek.",ro:"Minte sănătoasă într-un corp sănătos.",bad:["Mens sana in corpus sanum.","Mens sanus in corpore sano.","Mentem sanam in corpore sano."],g:"Mens nőnemű alanyeset: sana; az in helyhatározóként ablativusszal áll: corpore sano."},
 {la:"Per aspera ad astra.",hu:"Rögös úton a csillagokig.",ro:"Prin greutăți spre stele.",bad:["Per asperam ad astra.","Per aspera ad astris.","Per aspera ad astrorum."],g:"A per és az ad is tárgyesetet (accusativust) kíván: aspera, astra (semleges többes)."},
 {la:"Historia est magistra vitae.",hu:"A történelem az élet tanítómestere.",ro:"Istoria este învățătoarea vieții.",bad:["Historia est magistra vita.","Historia est magister vitae.","Historiam est magistra vitae."],g:"Historia nőnemű, ezért a nőnemű magistra illik hozzá; vitae birtokos eset."},
 {la:"Divide et impera.",hu:"Oszd meg és uralkodj!",ro:"Dezbină și stăpânește!",bad:["Dividi et impera.","Divide et imperare.","Divida et impera."],g:"Két felszólító módú ige egyes szám 2. személyben: divide, impera."},
 {la:"Ars longa, vita brevis.",hu:"A művészet hosszú (örök), az élet rövid.",ro:"Arta e lungă, viața e scurtă.",bad:["Ars longus, vita brevis.","Ars longa, vita breve.","Artis longa, vita brevis."],g:"Ars és vita nőnemű alanyeset: longa, brevis (a brevis hím- és nőnemben azonos)."},
 {la:"Non scholae, sed vitae discimus.",hu:"Nem az iskolának, hanem az életnek tanulunk.",ro:"Nu învățăm pentru școală, ci pentru viață.",bad:["Non scholae, sed vitae discimur.","Non scholae, sed vitam discimus.","Non scholarum, sed vitae discimus."],g:"Scholae és vitae részes eset (kinek, minek a javára); discimus többes szám 1. személy."},
 {la:"Dum spiro, spero.",hu:"Amíg élek (lélegzem), remélek.",ro:"Cât timp respir, sper.",bad:["Dum spiri, spero.","Dum spiro, spere.","Dum spirro, sperro."],g:"Spiro és spero jelen idő, egyes szám 1. személy."}
];

const MODES={
  alak:{name:"Helyes latin alak",task:"Melyik a nyelvtanilag helyes latin alak?",prompt:q=>q.hu,latin:false},
  jelentes:{name:"Magyar jelentés",task:"Mit jelent magyarul?",prompt:q=>q.la,latin:true},
  roman:{name:"Román fordítás",task:"Ce înseamnă în română?",prompt:q=>q.la,latin:true},
  kirako:{name:"Kirakó",task:"Rakd ki latinul! Vigyázz, két szó felesleges.",prompt:q=>q.hu,latin:false},
  lista:{name:"Tanulólista"}
};
const WORDS=[[100,"Optime! Kiváló!"],[80,"Bene! Szép munka!"],[50,"Satis. Megy ez!"],[0,"Repetitio est mater studiorum."]];

const stage=document.getElementById("stage");
const tabs=[...document.querySelectorAll("nav button")];
let mode="alak", st=null;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let roundLen=store.get("sl-len",10);

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function options(m,qi){
  const q=P[qi];
  if(m==="alak") return shuffle([{t:q.la,ok:true},...q.bad.map(t=>({t,ok:false}))]);
  const key=m==="jelentes"?"hu":"ro";
  const others=shuffle(P.map((_,i)=>i).filter(i=>i!==qi)).slice(0,3);
  return shuffle([{t:q[key],ok:true},...others.map(i=>({t:P[i][key],ok:false}))]);
}

function newRound(pool){
  const ids=pool||shuffle(P.map((_,i)=>i)).slice(0,roundLen);
  st={ids,pos:0,score:0,streak:0,best:0,missed:[],answered:false,done:false};
  ask(); window.scrollTo({top:0});
}

function head(){
  return `<div class="status"><span>${st.pos+1}. / ${st.ids.length}</span>
    <span>Pont: <b>${st.score}</b> · <span class="streak">Sorozat: ${st.streak}</span></span></div>
    <div class="bar"><i style="width:${st.pos/st.ids.length*100}%"></i></div>`;
}

function ask(){
  if(mode==="kirako") return askPuzzle();
  const m=MODES[mode], q=P[st.ids[st.pos]];
  st.opts=options(mode,st.ids[st.pos]); st.answered=false;
  stage.innerHTML=`${head()}
    <p class="task">${m.task}</p>
    <p class="prompt ${m.latin?"latin":""}">${esc(m.prompt(q))}</p>
    <div class="opts">${st.opts.map((o,i)=>`<button class="opt ${mode==="alak"?"lat":""}" data-i="${i}" id="opt-${i}"><span class="k">${"ABCD"[i]}</span><span class="t">${esc(o.t)}</span></button>`).join("")}</div>
    <div id="fb"></div>`;
  stage.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.i)));
}

function feedback(ok,q){
  const last=st.pos===st.ids.length-1;
  const gram=(mode==="alak"||mode==="kirako")?`<span class="row">${esc(q.g)}</span>`:"";
  document.getElementById("fb").innerHTML=`
    <div class="feedback ${ok?"ok":"no"}">
      <span class="verdict">${ok?"Recte! Helyes.":"Non recte. Nem talált."}</span>
      <span class="lat">${esc(q.la)}</span>
      <span class="row"><b>HU</b> ${esc(q.hu)}</span>
      <span class="row"><b>RO</b> ${esc(q.ro)}</span>${gram}
    </div>
    <div class="actions" style="margin-top:14px"><button class="btn" id="next">${last?"Eredmény":"Következő"}</button></div>`;
  stage.querySelector(".status").outerHTML=head().split("</div>")[0]+"</div>";
  const nx=document.getElementById("next"); nx.addEventListener("click",next);
  nx.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function score(ok,qi){ if(ok){st.score++;st.streak++;st.best=Math.max(st.best,st.streak)}else{st.streak=0;st.missed.push(qi)} }

function answer(i){
  if(st.answered) return; st.answered=true;
  const qi=st.ids[st.pos], ok=st.opts[i].ok;
  stage.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;
    if(st.opts[j].ok) b.classList.add("right"); else if(j===i) b.classList.add("wrong");});
  score(ok,qi); feedback(ok,P[qi]);
}

/* ---- puzzle ---- */
function askPuzzle(){
  const qi=st.ids[st.pos], q=P[qi], words=q.la.split(" ");
  const set=new Set(words);
  const decoys=shuffle([...new Set(q.bad.flatMap(b=>b.split(" ")).filter(w=>!set.has(w)))]).slice(0,2);
  st.pz={words,tiles:shuffle([...words,...decoys].map((w,i)=>({w,id:i}))),picked:[]};
  st.answered=false;
  stage.innerHTML=`${head()}
    <p class="task">${MODES.kirako.task}</p>
    <p class="prompt">${esc(q.hu)}</p>
    <div class="slot" id="slot" aria-label="A kirakott mondat"></div>
    <div class="pool" id="pool"></div>
    <div class="actions" id="pz-act"><button class="btn ghost" id="pz-clear">Újrakezdem</button><button class="btn" id="pz-check" disabled>Ellenőrzés</button></div>
    <div id="fb"></div>`;
  document.getElementById("pz-clear").addEventListener("click",()=>{st.pz.picked=[];drawPuzzle()});
  document.getElementById("pz-check").addEventListener("click",checkPuzzle);
  drawPuzzle();
}
function drawPuzzle(){
  const pz=st.pz, slot=document.getElementById("slot"), pool=document.getElementById("pool");
  const byId=id=>pz.tiles.find(t=>t.id===id);
  slot.innerHTML=pz.picked.length?pz.picked.map(id=>`<button class="tile" data-id="${id}">${esc(byId(id).w)}</button>`).join(""):`<span class="empty">Koppints a szavakra a helyes sorrendben.</span>`;
  pool.innerHTML=pz.tiles.filter(t=>!pz.picked.includes(t.id)).map(t=>`<button class="tile" data-id="${t.id}">${esc(t.w)}</button>`).join("");
  slot.querySelectorAll(".tile").forEach(b=>b.addEventListener("click",()=>{if(st.answered)return;pz.picked=pz.picked.filter(x=>x!==+b.dataset.id);drawPuzzle()}));
  pool.querySelectorAll(".tile").forEach(b=>b.addEventListener("click",()=>{if(st.answered)return;pz.picked.push(+b.dataset.id);drawPuzzle()}));
  document.getElementById("pz-check").disabled=pz.picked.length!==pz.words.length;
}
function checkPuzzle(){
  if(st.answered) return; st.answered=true;
  const qi=st.ids[st.pos], built=st.pz.picked.map(id=>st.pz.tiles.find(t=>t.id===id).w).join(" ");
  const ok=built===P[qi].la;
  document.getElementById("slot").classList.add(ok?"right":"wrong");
  document.querySelectorAll(".tile").forEach(b=>b.disabled=true);
  document.getElementById("pz-act").hidden=true;
  score(ok,qi); feedback(ok,P[qi]);
}

function next(){ if(!st.answered) return; st.pos++; if(st.pos<st.ids.length){ask();window.scrollTo({top:0})} else finish(); }

function finish(){
  const n=st.ids.length, pct=Math.round(st.score/n*100);
  const recKey="sl-best-"+mode, rec=store.get(recKey,0);
  if(pct>rec) store.set(recKey,pct);
  const word=WORDS.find(w=>pct>=w[0])[1];
  const missed=[...new Set(st.missed)];
  st.done=true;
  stage.innerHTML=`
    <div class="result">
      <p class="task">A kör vége · ${MODES[mode].name}</p>
      <div class="big">${st.score} / ${n}</div>
      <div class="word">${word}</div>
      <div class="status" style="justify-content:center;gap:14px"><span>${pct}%</span><span class="streak">Leghosszabb sorozat: ${st.best}</span><span>Legjobb: ${Math.max(pct,rec)}%</span></div>
      ${missed.length?`<div class="miss"><h3>Ezeket érdemes átismételni</h3>${missed.map(i=>`<div><span class="lat">${esc(P[i].la)}</span><br>${esc(P[i].hu)}<br><span style="color:var(--muted)">${esc(P[i].ro)}</span></div>`).join("")}</div>`:""}
    </div>
    <div class="settings"><label for="len">Kérdések száma:</label>
      <select id="len"><option value="10">10</option><option value="20">mind a 20</option></select></div>
    <div class="actions">
      ${missed.length?`<button class="btn ghost" id="again-miss">Csak a hibásak</button>`:""}
      <button class="btn" id="again">Új kör</button></div>`;
  const sel=document.getElementById("len"); sel.value=String(roundLen);
  sel.addEventListener("change",()=>{roundLen=+sel.value;store.set("sl-len",roundLen)});
  document.getElementById("again").addEventListener("click",()=>newRound());
  const am=document.getElementById("again-miss"); if(am) am.addEventListener("click",()=>newRound(shuffle(missed)));
  window.scrollTo({top:0});
}

function showList(){
  st=null;
  stage.innerHTML=`<p class="task">Mind a 20 szállóige</p><div class="list">${P.map((q,i)=>`
    <div class="item"><span class="n">${i+1}.</span><span class="lat">${esc(q.la)}</span><span class="hu">${esc(q.hu)}</span><span class="ro">${esc(q.ro)}</span></div>`).join("")}</div>`;
}

function setMode(m){
  mode=m;
  tabs.forEach(t=>t.setAttribute("aria-selected",t.dataset.mode===m?"true":"false"));
  document.getElementById("mode-name").textContent=MODES[m].name;
  store.set("sl-mode",m);
  if(m==="lista") showList(); else newRound();
  window.scrollTo({top:0});
}
tabs.forEach(t=>t.addEventListener("click",()=>setMode(t.dataset.mode)));

document.addEventListener("keydown",e=>{
  if(!st||st.done||e.target.tagName==="SELECT") return;
  if(!st.answered&&mode!=="kirako"&&/^[1-4]$/.test(e.key)){answer(+e.key-1);e.preventDefault()}
  else if(st.answered&&e.key==="Enter"&&document.activeElement.id!=="next"){next();e.preventDefault()}
});

const h=location.hash.slice(1);
const saved=store.get("sl-mode","alak");
setMode(MODES[h]?h:(MODES[saved]?saved:"alak"));
</script>

</body></html>
