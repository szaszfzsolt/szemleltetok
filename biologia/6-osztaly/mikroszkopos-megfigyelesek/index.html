<style>
/* Layout: kivetítős diavetítő; felül cím, középen 16:9 kép feliratréteggel, alul vezérlők */
:root{
  --bg:#E9EEE6; --panel:#F6F8F3; --ink:#17251F; --muted:#56675E; --line:#C9D3C6; --accent:#2F7D4F; --on-accent:#F6F8F3;

  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  /* a képek mindig világosak, ezért a képen lévő feliratok színe rögzített */
  --paper:#F7F7ED; --tag:#17251F; --tag-ink:#F7F7ED; --step:#2F7D4F;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1713; --panel:#16211B; --ink:#E4ECE4; --muted:#97AA9E; --line:#2B3B32; --accent:#6CC48C; --on-accent:#0F1713; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1713; --panel:#16211B; --ink:#E4ECE4; --muted:#97AA9E; --line:#2B3B32; --accent:#6CC48C; --on-accent:#0F1713; color-scheme:dark }
html,body{height:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.app{height:100%;display:flex;flex-direction:column;gap:10px;max-width:1700px;margin:0 auto}
.app:fullscreen{background:var(--bg);padding:12px 20px}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.head .n{font-family:var(--f-mono);font-size:1rem;color:var(--muted)}
.head h1{margin:0;font-weight:800;font-size:clamp(1.3rem,2.6vw,2.2rem);line-height:1.1;text-wrap:balance}
.stagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;aspect-ratio:1376/768;width:min(100%, calc((100dvh - 150px) * 1376 / 768));max-width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.app:fullscreen .stage{width:min(100%, calc((100vh - 130px) * 1376 / 768))}
.stage img,.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font-family:var(--f-display);font-weight:600;font-size:1rem;border-radius:999px;padding:9px 18px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button:hover{border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.spacer{flex:1}
.hint{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
/* SVG-feliratok */
.tag rect{fill:var(--tag)}
.tag text{fill:var(--tag-ink);font-family:var(--f-display);font-weight:600;font-size:24px}
.tag text.sub{font-size:17px;font-weight:500;opacity:.8}
.magbg{fill:#FFFFFF;fill-opacity:.88;stroke:#17251F;stroke-opacity:.18;stroke-width:1.5}
.mag text{fill:#17251F;font-family:var(--f-display)}
.mag .mh{font-size:24px;font-weight:800}
.mag .mf{font-size:20px;font-weight:600;fill:#2F7D4F}
.mag .mm{font-family:var(--f-mono);font-size:21px;font-weight:500}
.mag .mr{font-size:21px;font-weight:600}
.mag .mn{font-size:16px;fill:#56675E}
.mrule{stroke:#17251F;stroke-opacity:.2;stroke-width:1.5}
.lead{fill:none;stroke-linecap:round}
.lead.halo{stroke:#FFFFFF;stroke-width:6;opacity:.85}
.lead.core{stroke:var(--tag);stroke-width:2.5}
.dot{fill:var(--tag);stroke:#FFFFFF;stroke-width:2.5}
.step circle{fill:var(--step)}
.step .num{fill:#FFFFFF;font-family:var(--f-mono);font-size:17px;font-weight:500}
.step .cap{fill:#17251F;font-family:var(--f-display);font-weight:600;font-size:21px}
.step .capbg{fill:var(--paper);opacity:.9}
#labels{transition:opacity .4s}
#labels.off{opacity:0}
@media (prefers-reduced-motion:reduce){#labels{transition:none}}
/* Kezdőlap */
.home{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:22px;padding-block:8px 4px}
.home header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.home .eyebrow{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.home h1{margin:4px 0 0;font-weight:800;font-size:clamp(2rem,4.6vw,3.6rem);line-height:1;letter-spacing:-.01em;text-wrap:balance}
.home .sub{margin:8px 0 0;color:var(--muted);font-size:1.05rem}
.start{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-size:1.1rem;padding:12px 24px}
.start:hover{border-color:var(--ink)}
.tiles{list-style:none;margin:auto 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:26px 22px}
.tiles li{width:clamp(130px,min(14.5vw,26vh),240px)}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;text-align:center;border-radius:16px;padding:8px 6px}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile .lens{width:100%;aspect-ratio:1;max-width:100%;border-radius:50%;overflow:hidden;border:7px solid #141A17;box-shadow:0 0 0 2px var(--line),0 6px 16px rgba(0,0,0,.18);transition:transform .2s ease}
.tile .lens img{width:100%;height:100%;object-fit:cover;display:block}
.tile:hover .lens,.tile:focus-visible .lens{transform:scale(1.05)}
.tile .t{display:flex;flex-direction:column;gap:2px;align-items:center;font-weight:600;font-size:1rem;line-height:1.2;color:var(--ink);text-wrap:balance}
.tile .t span{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-weight:500}
@media (prefers-reduced-motion:reduce){.tile .lens{transition:none}}
.is-home .head,.is-home .stagewrap,.is-home .slide-only{display:none!important}
.app:not(.is-home) .home{display:none}
</style>

}
function setHash(h){try{if(location.hash.slice(1)!==h)location.hash=h}catch(e){}}
function fromHash(){const h=location.hash.slice(1),n=SLIDES.findIndex(s=>hid(s)===h);if(n>=0){i=n;$("app").classList.remove("is-home");render()}else showHome()}
const tiles=$("tiles");
SLIDES.forEach((s,n)=>{
  const li=document.createElement("li"),b=document.createElement("button");
  b.type="button";b.className="tile";
  b.innerHTML='<span class="lens"><img alt="" loading="lazy" src="thumbs/t'+String(s.no).padStart(2,"0")+'.jpg"></span><span class="t"><span>'+(s.no||"alapok")+'</span>'+s.title+'</span>';
  b.addEventListener("click",()=>go(n));li.appendChild(b);tiles.appendChild(li);
});
$("start").onclick=()=>go(0);$("homeBtn").onclick=()=>go(-1);
window.addEventListener("hashchange",fromHash);
function toggle(){show=!show;$("tl").setAttribute("aria-pressed",String(show));$("labels").classList.toggle("off",!show)}
$("prev").onclick=()=>{if(i>0)go(i-1)};$("next").onclick=()=>go(i+1);$("tl").onclick=toggle;
$("fs").onclick=()=>{try{const p=document.fullscreenElement?document.exitFullscreen():$("app").requestFullscreen();if(p&&p.catch)p.catch(()=>{})}catch(e){}};
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="PageDown"){if(i<SLIDES.length-1)go(i+1)}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){if(i>0)go(i-1)}
  else if(e.key==="Escape"||e.key==="Home"){if(i>=0)go(-1)}
  else if((e.key==="f"||e.key==="F")&&i>=0)toggle();
});
fromHash();
})();
</script>

</body></html>
